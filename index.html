<!doctype html>
<html lang="en" data-theme="daylight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mweshi — Serialized AI Cinema</title>
  <meta name="description" content="Mweshi is a dedicated streaming platform for serialized AI shows. Watch episodes in order, swipe vertical scene Reels into full series, and inspect full Made With provenance.">
  <meta name="theme-color" content="#F4F1EA" id="theme-color-meta">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("tesser.state.v2");
        var parsed = raw ? JSON.parse(raw) : null;
        var theme = parsed && parsed.theme === "petrol" ? "petrol" : "daylight";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", theme === "petrol" ? "#0B171A" : "#F4F1EA");
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/catalog.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <a class="sr-only" href="#app-root">Skip to content</a>

  <!-- Open Architectural Top Navigation (Bare Aperture Serif Wordmark — Zero Pill, Zero Dot) -->
  <header class="top-chrome" id="top-chrome">
    <a class="brand-lockup" href="#/" aria-label="Mweshi Home">
      <svg class="brand-wordmark-svg" viewBox="0 0 150 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MWESHI">
        <text x="1" y="36" fill="currentColor" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif" font-size="40" font-weight="400" letter-spacing="4.2">MWESHI</text>
        <line x1="12" y1="41" x2="23" y2="7" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="butt"/>
      </svg>
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a class="nav-link" href="#/" data-nav="home" aria-current="page">Home</a>
      <a class="nav-link" href="#/reels" data-nav="reels">Reels</a>
      <a class="nav-link" href="#/pilots" data-nav="pilots">Pilots</a>
      <a class="nav-link" href="#/library" data-nav="library">Library</a>
      <a class="nav-link" href="#/creators" data-nav="creators">For Creators</a>
    </nav>

    <div class="top-actions">
      <button class="icon-btn" type="button" id="theme-toggle-btn" aria-label="Switch to Midnight Petrol dark theme" title="Switch theme (Daylight / Midnight Petrol)">
        <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
      <a class="icon-btn desktop-search-btn" href="#/search" data-nav="search" aria-label="Search catalogue" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
        </svg>
      </a>
    </div>
  </header>

  <!-- Dynamic Application Stage -->
  <main id="app-root" tabindex="-1">
    <noscript>
      <div class="page-shell">
        <h1 class="page-title">Mweshi — Serialized AI Cinema</h1>
        <p class="page-lede">Enable JavaScript to use the interactive episodic streaming player, vertical Reels feed, and series provenance dossier. You can also read the <a href="letter/" style="text-decoration:underline">founder's letter</a> or <a href="soul.md" style="text-decoration:underline">agent overview</a>.</p>
      </div>
    </noscript>
  </main>

  <!-- Mobile & Tablet Floating Bottom Dock + Detached Search Circle -->
  <div class="bottom-dock-wrap" id="bottom-dock-wrap">
    <nav class="bottom-dock" aria-label="Mobile navigation">
      <a class="dock-tab" href="#/" data-nav="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6L12 3.2Z"/></svg>
        <span>Home</span>
      </a>
      <a class="dock-tab" href="#/reels" data-nav="reels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><polygon points="10 8.5 15.5 12 10 15.5 10 8.5" fill="currentColor" stroke="none"/></svg>
        <span>Reels</span>
      </a>
      <a class="dock-tab" href="#/pilots" data-nav="pilots">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.2 6-.8L12 3z"/></svg>
        <span>Pilots</span>
      </a>
      <a class="dock-tab" href="#/library" data-nav="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13.5" y2="13"/></svg>
        <span>Library</span>
      </a>
      <a class="dock-tab" href="#/creators" data-nav="creators">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
        <span>Creators</span>
      </a>
    </nav>

    <a class="dock-search-btn" href="#/search" data-nav="search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
      </svg>
    </a>
  </div>

  <!-- Edge-to-Edge Cinema Player Overlay (Darkroom Theater Mode) -->
  <div class="player-modal" id="player-modal" role="dialog" aria-modal="true" aria-label="Video player" hidden>
    <div class="player-stage" id="player-stage" data-aspect="cinema">
      <video id="cinema-video" playsinline preload="metadata"></video>
      <iframe id="cinema-iframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen hidden title="Creator screener player"></iframe>

      <!-- Buffering & Graceful Error Recovery Overlay -->
      <div class="player-status-overlay" id="player-status" hidden>
        <div class="player-spinner" id="player-spinner"></div>
        <div id="player-status-msg" style="font-size:var(--text-sm);color:rgba(245,242,234,0.88);max-width:22rem;">Loading episode stream&hellip;</div>
        <button class="btn-play-white" type="button" id="player-retry-btn" hidden style="height:2.45rem;min-width:auto;padding:0 1.2rem;">Retry Stream</button>
      </div>

      <!-- Top Translucent Player Chrome -->
      <div class="player-top-chrome">
        <div class="player-title-group">
          <button class="glass-icon-btn" type="button" id="player-close-btn" aria-label="Close player">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
          <div class="player-title-text">
            <div id="player-series-label"></div>
            <div id="player-ep-label" class="tabular"></div>
          </div>
        </div>

        <div class="player-top-actions">
          <button class="glass-chip glass-chip--cinema" type="button" id="player-aspect-btn" title="Switch Cinema 16:9 / Feed 9:16 crop">
            16:9
          </button>
          <button class="glass-chip glass-chip--cinema" type="button" id="player-test-end-btn" title="Jump to last 5 seconds (debug mode)" hidden>
            End Card
          </button>
          <button class="glass-icon-btn" type="button" id="player-fs-btn" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
        </div>
      </div>

      <!-- Bottom Scrubber Chrome -->
      <div class="player-bottom-chrome" id="player-bottom-chrome">
        <div class="player-controls-row">
          <div class="player-controls-group">
            <button class="glass-icon-btn" type="button" id="player-playpause-btn" aria-label="Play or pause">
              <svg id="player-play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 5 19 12 7 19 7 5"/></svg>
            </button>
            <button class="glass-chip glass-chip--cinema tabular" type="button" id="player-back10-btn" aria-label="Back 10 seconds">-10s</button>
            <button class="glass-chip glass-chip--cinema tabular" type="button" id="player-fwd10-btn" aria-label="Forward 10 seconds">+10s</button>
          </div>
          <div class="player-controls-group">
            <button class="glass-chip glass-chip--cinema" type="button" id="player-mute-btn" aria-label="Toggle sound">
              <svg id="player-mute-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <span class="player-chip-label" id="player-mute-label">Sound</span>
            </button>
            <button class="glass-chip glass-chip--cinema" type="button" id="player-provenance-btn" aria-label="Made With provenance">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span class="player-chip-label">Made With</span>
            </button>
          </div>
        </div>

        <div class="scrubber-row" id="player-scrubber-row">
          <span class="scrubber-time tabular" id="player-elapsed" style="text-align:left;">0:00</span>
          <input class="scrubber-input" type="range" id="player-scrubber" min="0" max="100" value="0" step="0.25" aria-label="Episode timeline">
          <span class="scrubber-time tabular" id="player-remaining">-0:00</span>
        </div>
      </div>

      <!-- Non-Occluding Floating Bottom-Right Up-Next Card -->
      <div class="upnext-overlay" id="player-upnext" hidden>
        <div class="upnext-head">
          <span class="upnext-eyebrow">Up Next</span>
          <button class="glass-icon-btn" type="button" id="upnext-dismiss-btn" style="width:1.85rem;height:1.85rem;" aria-label="Dismiss Up Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
        <p class="upnext-series" id="upnext-series-title">Tears of Steel</p>
        <p class="upnext-ep" id="upnext-ep-title">S1, E2 · Forty Years Later</p>
        <div style="display:flex;align-items:center;gap:0.55rem;">
          <button class="btn-play-white" type="button" id="upnext-play-btn" style="height:2.5rem;min-width:auto;padding:0 1.1rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
            <span id="upnext-btn-label">Next Episode</span>
          </button>
          <button class="glass-chip glass-chip--cinema" type="button" id="upnext-replay-btn" style="height:2.5rem;padding:0 1rem;">Replay</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable Sheet Modal (Provenance Quick View & Local Storage Info) -->
  <dialog class="apple-sheet" id="apple-sheet">
    <div class="sheet-header">
      <h3 id="sheet-title">Details</h3>
      <button class="icon-btn" type="button" id="sheet-close-btn" style="width:2.1rem;height:2.1rem;" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-content" id="sheet-body"></div>
  </dialog>

  <!-- Subtle Floating Toast -->
  <div class="toast" id="app-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
